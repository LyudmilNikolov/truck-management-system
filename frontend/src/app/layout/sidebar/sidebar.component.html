<div
  class="sidenav"
  [ngClass]="isSidebarCollapsed() ? 'sidenav-collapsed' : ''"
>
  <div class="logo-container">
    <button class="logo" (click)="toggleCollapse()">
      <i class="fal fa-bars"></i>
    </button>
    @if (!isSidebarCollapsed()) {
      <div class="logo-text">TMS</div>
      <button class="btn-close" (click)="closeSidenav()">
        <i class="fal fa-times close-icon"></i>
      </button>
    }
  </div>
  <div class="sidenav-nav">
    @for (item of items; track $index) {
      <li class="sidenav-nav-item">
        @if (!item.isLogout) {
          <a
            class="sidenav-nav-link"
            [routerLink]="item.routeLink"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <mat-icon class="sidebar-link-icon" [class]="item.icon">{{
              item.icon
            }}</mat-icon>
            @if (!isSidebarCollapsed()) {
              <span class="sidenav-link-text">{{ item.label }}</span>
            }
          </a>
        } @else {
          <button class="sidenav-nav-link" (click)="logout()">
            <mat-icon class="sidebar-link-icon" [class]="item.icon">{{
              item.icon
            }}</mat-icon>
            @if (!isSidebarCollapsed()) {
              <span class="sidenav-link-text">{{ item.label }}</span>
            }
          </button>
        }
      </li>
    }
  </div>
</div>
